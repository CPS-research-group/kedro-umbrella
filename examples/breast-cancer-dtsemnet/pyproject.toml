[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "breast_cancer_dtsemnet"
readme = "README.md"
dynamic = [ "version",]
dependencies = [ "ipython>=8.10", "jupyterlab>=3.0", "notebook", "kedro[jupyter]~=0.19.10", "kedro-datasets[pandas-csvdataset, pandas-exceldataset, pandas-parquetdataset, plotly-plotlydataset, plotly-jsondataset, matplotlib-matplotlibdataset]>=3.0", "kedro-viz>=6.7.0", "scikit-learn~=1.5.1", "seaborn~=0.12.1",]

[project.scripts]
breast-cancer-dtsemnet = "breast_cancer_dtsemnet.__main__:main"

[tool.kedro]
package_name = "breast_cancer_dtsemnet"
project_name = "breast-cancer-dtsemnet"
kedro_init_version = "1.0.0"
tools = "['None']"
example_pipeline = "True"
source_dir = "src"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "breast_cancer_dtsemnet.__version__"

[tool.setuptools.packages.find]
where = [ "src",]
namespaces = false
