# PEP-518 https://peps.python.org/pep-0518/
[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools>=65.5.1"]  # PEP 518 specifications
build-backend = "setuptools.build_meta"

[project]
name = "kedro-umbrella"
authors = [
    {name = "CNRS@CREATE"}
]
description = "kedro-umbrella allows to create ML based digital twin pipelines"
requires-python = ">=3.7"
dynamic = ["readme", "version", "dependencies"]

[tool.setuptools]
packages = ["kedro_umbrella", "kedro_umbrella.library", "kedro_umbrella.blocks"]
include-package-data = true

[tool.setuptools.package-data]
"kedro_umbrella" = [
  "template/*",
  "template/**/*",
  "template/**/.gitkeep"
]

[tool.setuptools.dynamic]
readme = {file = "README.md", content-type = "text/markdown"}
version = {attr = "kedro_umbrella.__version__"}
dependencies = {file = "requirements.txt"}

[tool.pytest.ini_options]
addopts="""
--cov-config pyproject.toml \
--cov-report xml:coverage.xml \
--cov-report term-missing \
--cov kedro_umbrella \
--cov tests \
--no-cov-on-fail \
-ra \
-p no:warnings \
"""
testpaths = [
  "tests"
]

[tool.ruff]
line-length = 88
target-version = "py37"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "kedro_umbrella/template",
    "examples"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B028", # no explicit stacklevel keyword argument found
    "C408", # unnecessary dict call (literal instead)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = [
    "S101",  # use of assert
]

[tool.ruff.lint.isort]
known-first-party = ["kedro_umbrella"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.entry-points."kedro.project_commands"]
umbrella = "kedro_umbrella.plugin:commands"
